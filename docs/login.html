<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - Kasir Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/login-DieQw4RW.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/api-CcfnD3tS.js">
  <link rel="stylesheet" crossorigin href="./assets/api-CSHIK8aB.css">
  <link rel="stylesheet" crossorigin href="./assets/login-BgJO_g4Q.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-badge">
        <svg class="icon-lg" viewBox="0 0 24 24"><path d="M3 3h18v6a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V3z"/><path d="M7 13v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-5"/><path d="M17 8h2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-2"/></svg>
      </div>
    </div>
    <h1>Kasir Cafe</h1>
    <p class="subtitle">Masuk untuk mulai shift transaksi Anda</p>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" required autocomplete="username" placeholder="mis. admin">
      <label>Password</label>
      <div class="password-field">
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••">
        <button type="button" id="togglePassword" class="password-toggle" aria-label="Tampilkan password">
          <svg class="icon-eye icon-eye-show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye icon-eye-hide" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.4 18.4 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button type="submit" class="btn-submit">Masuk</button>
      <p id="loginError" class="error-text"></p>
    </form>
  </div>
</body>
</html>
